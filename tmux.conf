# --- Lazyvim Theme ---

# base    #1e1e2e
# mantle  #181825
# surface #313244
# text    #cdd6f4
# subtext #a6adc8
# blue    #89b4fa
# mauve   #cba6f7
# green   #a6e3a1
# red     #f38ba8
# peach   #fab387

# General
set -g status-position top
set -g status-interval 2

set -g status-style "bg=default,fg=#a6adc8"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Panes
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Windows (tabs)
setw -g window-status-style "bg=#181825,fg=#a6adc8"
setw -g window-status-current-style "bg=#313244,fg=#cdd6f4,bold"
setw -g window-status-activity-style "bg=#181825,fg=#fab387"
setw -g window-status-bell-style "bg=#181825,fg=#f38ba8,bold"

# Separators / formatting
set -g status-left-length 60
set -g status-right-length 120

# Left: session (+host)
# set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#181825] #[fg=#cdd6f4,bg=#181825] #h "
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#181825] "

# Right: path + time
set -g status-right "#[fg=#a6adc8,bg=default] #(pwd | sed 's|^'"$HOME"'|~|') #[fg=#89b4fa,bg=default] %I:%M %p "

# Make window names a bit nicer
setw -g window-status-format " #[fg=#a6adc8]#I:#W "
setw -g window-status-current-format " #[fg=#cdd6f4,bold]#I:#W "
